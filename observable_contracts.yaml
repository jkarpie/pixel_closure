# A closure campaign is generated from one representable PDF, not from an
# ensemble second moment.  L1 universes below vary noise only.
truth_laws:
  jam_full:
    kind: fixed_lhapdf_member
    campaign_identifier: jam_full_member_1_v1
    set: JAM24_PDF_proton_nlo
    member: 1
    seed: null
    noise_universes_vary: experimental_and_systematic_noise_only
  nnpdf_full:
    kind: fixed_lhapdf_member
    campaign_identifier: nnpdf_full_member_1_v1
    set: NNPDF40_nnlo_as_01180_1000
    member: 1
    seed: null
    noise_universes_vary: experimental_and_systematic_noise_only

# These lists are expanded and checked against manifests; no config.py list is
# authoritative.  Reader-only candidates are intentionally absent.
full_closure_modes:
  # Three selections over one registry.  ``jam_data`` and ``nnpdf_data`` are the two
  # published analyses' own dataset choices, restricted to what this closure can
  # actually build; ``jam_full``/``nnpdf_full`` are their INTERSECTION and are what the
  # two headline suites run.  The truth family and the dataset selection are independent
  # axes: closure_NNPDF_truth_JAM_data is the NNPDF4.0 truth on JAM24's data.
  #
  # **The buildable universe is set by the closure, not by the papers.**
  # ``closure_*/datasets.py::_EXP_BUILDERS`` is exactly {f2, sigma_r, sigma_r_cc,
  # drell_yan} plus the lattice ``pseudoitd``/``mellin`` pair.  A kernel existing inside
  # PIXEL does not make a dataset constructible here -- inclusive jets have a native
  # ``InclusiveJetKernel`` (LO only, and it raises above LO) and collider Drell-Yan has
  # both ``DrellYanElectroweak`` and transcribed fiducial cuts for 18 sets in
  # ``nnpdf40_fiducial_cuts.yaml``, and neither can be selected because no closure
  # builder consumes them.  Every such case is carried below as a reader_only record
  # with its own drop_reason, so a future builder is a one-line promotion here.

  #: JAM24 (arXiv:2501.00665), PDF-relevant subset.  Source of truth for the selection is
  #: ``fitpack_legacy/examples/input.py`` (uncommented entries).  Excluded there:
  #: ``sia``/``sidis``/``psidis``/``pp_hadron`` (need fragmentation functions, per the
  #: owner's scope) and ``pidis``/``pjet`` (polarized -- they constrain helicity PDFs and
  #: this suite carries nine *unpolarized* fields, so there is nothing for them to fit).
  #: Dropped for want of a builder: ``wc`` (5), ``wzrv`` (11), ``wasym`` (2), ``zrap``
  #: (2), ``jet`` (4), ``ln`` (2), plus idis 10021 (d/p ratio) and dy 20001/20002
  #: (E866/E906 pd-over-2pp ratios).  idis 10003 (JLab Hall C) is in JAM's list and has a
  #: ``sigma_r`` builder, but every row fails the Q2 >= mc^2 / W2 > 10 closure cuts.
  jam_data:
    classifications: [physics, legacy_compatibility, synthetic_proxy]
    dataset_ids: &jam_data_ids
      - lattice.a117m310
      - lattice.a087m290
      - lattice.a087m290l
      - lattice.a087m230
      - lattice.a087m230x
      - lattice.a086m180
      - lattice.a086m180l
      - lattice.a068m290
      - lattice.a068m230
      - lattice.a068m175
      - lattice.a067m135
      - lattice.a053m295
      - lattice.a053m230
      - dis.slac_p_10010
      - dis.bcdms_p_10016
      - dis.nmc_p_10020
      - dis.slac_d_10011
      - dis.bcdms_d_10017
      # HERMES sigma_r is JAM-only: it is absent from the NNPDF4.0 roster, so it is the
      # one DIS record that does not survive into the intersection.
      - dis.hermes_p_10007
      - dis.hera_ep_10026
      - dis.hera_ep_10027
      - dis.hera_ep_10028
      - dis.hera_ep_10029
      - dis.hera_em_10030
      - dis.hera_cc_ep_10031
      - dis.hera_cc_em_10032
      # E866 pp absolute (M^3 dsig/dM dxF, 184 source rows).  JAM's dy list is
      # 10001/20001/20002; the latter two are pd-over-2pp ratios.  E866 *pd* absolute
      # (10002) is deliberately absent -- see the note on nnpdf_data.
      - dy.e866_pp_10001

  #: NNPDF4.0 (arXiv:2109.02653), linear/bilinear subset.  Source of truth is
  #: ``nnpdf40_dis_dy_roster.yaml``, whose own ``scope`` already excludes jets, dijets,
  #: top, single top, prompt photon, V+jet and Z-pT.  Of its 43 DIS/DY entries the
  #: owner's linear-or-bilinear rule keeps 36, dropping the 7 ratio/asymmetry sets
  #: (NMCPD, DYE886R, DYE906R, D0ZRAP_40, D0WMASY, CMSWEASY840PB, CMSWMASY47FB).
  #: Of those 36, buildable here: NMC/SLACP/SLACD/BCDMSP/BCDMSD, CHORUS nu+nb, the seven
  #: HERACOMB sets, and DYE886P.  Not buildable: NuTeV nu/nb (CC dimuon charm),
  #: HERACOMB_SIGMARED_B (needs the FONLL-B/C two-loop massive coefficient), DYE605
  #: (copper nuclear DY) and all 17 collider DY sets (no bin-integrated W/Z builder).
  nnpdf_data:
    classifications: [physics, legacy_compatibility, synthetic_proxy]
    dataset_ids: &nnpdf_data_ids
      - lattice.a117m310
      - lattice.a087m290
      - lattice.a087m290l
      - lattice.a087m230
      - lattice.a087m230x
      - lattice.a086m180
      - lattice.a086m180l
      - lattice.a068m290
      - lattice.a068m230
      - lattice.a068m175
      - lattice.a067m135
      - lattice.a053m295
      - lattice.a053m230
      - dis.slac_p_10010
      - dis.bcdms_p_10016
      - dis.nmc_p_10020
      - dis.slac_d_10011
      - dis.bcdms_d_10017
      # These seven ARE NNPDF4.0's HERACOMB sets.  Verified 2026-09-09 against
      # ``nnpdf/nnpdf_data/nnpdf_data/commondata`` by reading each NNPDF copy and
      # applying the closure cuts: source and post-cut row counts agree exactly, set for
      # set, and both carry 169 correlated systematics.
      #
      #   10026 = HERACOMBNCEP920  HERA_NC_318GEV/EP-SIGMARED  485 -> 402
      #   10027 = HERACOMBNCEP820  HERA_NC_300GEV/EP-SIGMARED  112 ->  75
      #   10028 = HERACOMBNCEP575  HERA_NC_251GEV/EP-SIGMARED  260 -> 259
      #   10029 = HERACOMBNCEP460  HERA_NC_225GEV/EP-SIGMARED  209 -> 209
      #   10030 = HERACOMBNCEM     HERA_NC_318GEV/EM-SIGMARED  159 -> 159
      #   10031 = HERACOMBCCEP     HERA_CC_318GEV/EP-SIGMARED   39 ->  39
      #   10032 = HERACOMBCCEM     HERA_CC_318GEV/EM-SIGMARED   42 ->  42
      #
      # The legacy names carry the *proton beam* energy, the commondata directories the
      # CM energy, which is why 920<->318 and 460<->225 look mismatched and are not.
      # They are one measurement (H1+ZEUS combined), so both modes point at the single
      # Fitpack-sourced record rather than duplicating it under a second id: a duplicate
      # would generate byte-identical fake data through a second read path.  NNPDF's own
      # copy is recorded in each record's evidence block.
      - dis.hera_ep_10026
      - dis.hera_ep_10027
      - dis.hera_ep_10028
      - dis.hera_ep_10029
      - dis.hera_em_10030
      - dis.hera_cc_ep_10031
      - dis.hera_cc_em_10032
      # CHORUS is NNPDF-only: it is absent from JAM's idis list, so it is the one DIS
      # entry that does not survive into the intersection.
      - dis.chorus_nu
      - dis.chorus_nb
      # DYE886P = E866 pp absolute = fitpack dy/10001.
      - dy.e866_pp_10001
      # Bin-integrated fiducial collider Z rapidity, promoted 2026-09-09 with the
      # ``drell_yan_binned`` builder.  These five are the roster's collider Drell-Yan
      # entries whose fiducial-cut records are resolved with zero open questions; the
      # other twelve stay reader_only above, each with its own reason.
      - z.lhcb7_dielectron
      - z.lhcb8_dielectron
      - z.lhcb13_dimuon
      - z.lhcb13_dielectron
      - z.atlas8_lomass_2d
      # Heavy-flavour-tagged NC reduced cross section, promoted 2026-09-09.  The old
      # drop_reason named FONLL-B/C, which is a theory-200 *parity* requirement; this
      # closure runs NLO and FONLL-A is the matching variant.
      - dis.heracomb_bottom
      # Fixed-target nuclear Drell-Yan, promoted 2026-09-09.  The isospin content of a
      # nucleus is one number (Z/A) and the nuclear uncertainty rides in the _dw_
      # covariance variant, so "no approved copper nuclear law" was not the blocker.
      - dy.e605_copper

  #: The UNION of the two selections above -- everything either analysis fits, which is
  #: what the two headline suites run.  **Changed from the intersection 2026-09-09** at
  #: the owner's request: "the larger set which contains everything used in both or
  #: either".
  #:
  #: 36 datasets / 4291 rows, against the intersection's 26 / 2926.  The ten it adds:
  #: ``dis.hermes_p_10007`` (JAM-only, 34 rows) and, all NNPDF-only, ``dis.chorus_nu``
  #: + ``dis.chorus_nb`` (520 each), ``dis.heracomb_bottom`` (27), ``dy.e605_copper``
  #: (119) and the five collider Z sets (145 between them).
  #:
  #: **The comparison property survives the change.**  Both headline suites still run
  #: exactly the same dataset, so ``closure_JAM_truth`` vs ``closure_NNPDF_truth`` is
  #: still a pure truth-vs-truth comparison with no dataset difference confounding it;
  #: the union simply makes that comparison on more data than the intersection did.
  #: What changes is cost -- 4291 rows against 2926, and the added rows include the
  #: expensive ones (CHORUS is 1040, the bin-integrated collider Z sets are the
  #: slowest per row in the suite).
  #:
  #: ``dy.e866_pd_10002`` is still in none of the four modes: it is in neither
  #: published selection, so it is not in their union either.  See the note on
  #: ``nnpdf_data`` for the workbook measurement behind that.
  jam_full:
    classifications: [physics, legacy_compatibility, synthetic_proxy]
    dataset_ids: &union_ids
      - lattice.a117m310
      - lattice.a087m290
      - lattice.a087m290l
      - lattice.a087m230
      - lattice.a087m230x
      - lattice.a086m180
      - lattice.a086m180l
      - lattice.a068m290
      - lattice.a068m230
      - lattice.a068m175
      - lattice.a067m135
      - lattice.a053m295
      - lattice.a053m230
      - dis.slac_p_10010
      - dis.bcdms_p_10016
      - dis.nmc_p_10020
      - dis.slac_d_10011
      - dis.bcdms_d_10017
      # JAM-only: HERMES sigma_r is absent from the NNPDF4.0 roster.
      - dis.hermes_p_10007
      - dis.hera_ep_10026
      - dis.hera_ep_10027
      - dis.hera_ep_10028
      - dis.hera_ep_10029
      - dis.hera_em_10030
      - dis.hera_cc_ep_10031
      - dis.hera_cc_em_10032
      # NNPDF-only from here down: none of these is in JAM's input.py.
      - dis.chorus_nu
      - dis.chorus_nb
      - dis.heracomb_bottom
      - dy.e866_pp_10001
      - dy.e605_copper
      - z.lhcb7_dielectron
      - z.lhcb8_dielectron
      - z.lhcb13_dimuon
      - z.lhcb13_dielectron
      - z.atlas8_lomass_2d
  nnpdf_full:
    classifications: [physics, legacy_compatibility, synthetic_proxy]
    dataset_ids: *union_ids

